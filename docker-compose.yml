# Cần huấn luyện trước (để có thư mục models/ và mlflow.db), xem README.
services:
  api:
    build: .
    image: car-price-api
    ports: ["8000:8000"]
    volumes:
      - ./logs:/app/logs
      - ./Data/images:/app/Data/images:ro    # giữ log dự đoán/lỗi/feedback ngoài container
  mlflow:
    image: car-price-api
    depends_on: [api]
    # Cùng backend sqlite với src/tracking.py. Lưu ý: đường dẫn artifact trong mlflow.db là đường dẫn tuyệt đối trên
    # máy đã huấn luyện, nên xem tham số/chỉ số thì được; xem file artifact/mô hình có thể cần chạy MLflow UI trên chính máy đó.
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlflow.db
    ports: ["5000:5000"]
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
