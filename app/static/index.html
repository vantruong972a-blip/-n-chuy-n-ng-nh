<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dự đoán giá xe</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #14181f; --muted: #667085; --line: #e4e7ec;
    --accent: #1f6feb; --accent-soft: #e8f0fe; --ok: #067647;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #171b23; --text: #eef0f4; --muted: #98a2b3; --line: #2a303b;
            --accent: #5b9dff; --accent-soft: #1b2a45; --ok: #47cd89; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; }
  .fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px; }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab { padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .price { font-size: 40px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 2px; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .best { color: var(--ok); font-weight: 600; }
  .err { color: #d92d20; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dự đoán giá xe</h1>
  <p class="sub">Nhập thông số kỹ thuật, hệ thống dùng các mô hình đã huấn luyện để ước tính giá.</p>

  <div class="grid">
    <form class="card" id="form" autocomplete="off">
      <h2>Thông số xe</h2>
      <div class="fields" id="main"></div>
      <details id="moreBox" hidden>
        <summary>Thông số khác</summary>
        <div class="fields" id="more"></div>
      </details>
      <div class="row">
        <button class="primary" type="submit" id="go">Dự đoán giá</button>
        <button type="button" id="fill">Điền giá trị trung bình</button>
      </div>
      <div class="err" id="err"></div>
    </form>

    <div>
      <div class="card" id="result">
        <h2>Kết quả</h2>
        <div class="tabs" id="tabs"></div>
        <div id="out"><div class="empty">Chưa có dự đoán. Điền thông số rồi bấm "Dự đoán giá".</div></div>
      </div>
      <div class="card" id="metricsCard" style="margin-top:16px" hidden>
        <h2 id="metricsTitle">Độ chính xác mô hình (tập test)</h2>
        <table id="metrics"></table>
        <div class="muted" style="margin-top:8px">MAE/RMSE càng thấp càng tốt, R² càng gần 1 càng tốt.</div>
      </div>
    </div>
  </div>
</div>

<script>
const KEY = ["enginesize", "horsepower", "curbweight", "citympg", "highwaympg"];
const $ = (s) => document.querySelector(s);
let UNIT = "", UNIT_NOTE = "", VERSION = "";
const fmt = (v) => Math.round(v).toLocaleString("en-US") + " " + UNIT;
let META = [], MODELS = {}, current = "", last = null;

function field(f) {
  const d = document.createElement("div");
  const l = document.createElement("label");
  l.textContent = f.name; l.htmlFor = "f_" + f.name;
  let el;
  if (f.type === "number") {
    el = document.createElement("input");
    el.type = "number"; el.step = "any"; el.min = f.min; el.max = f.max;
    el.placeholder = Math.round(f.median);
  } else {
    el = document.createElement("select");
    f.options.forEach((o) => el.add(new Option(o, o)));
    el.value = f.default;
  }
  el.id = "f_" + f.name; el.name = f.name;
  d.append(l, el);
  if (f.type === "number") {
    const h = document.createElement("div");
    h.className = "hint"; h.textContent = `Khoảng ${f.min} – ${f.max}`;
    d.append(h);
  }
  return d;
}

function renderTabs() {
  const t = $("#tabs"); t.innerHTML = "";
  Object.entries(MODELS).forEach(([k, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab" + (k === current ? " on" : ""); b.textContent = label;
    b.onclick = () => { current = k; renderTabs(); if (last) renderResult(); };
    t.append(b);
  });
}

function renderResult() {
  const sel = last.all.find((a) => a.model === current);
  const prices = last.all.map((a) => a.price);
  const rows = last.all.map((a) =>
    `<tr><td>${a.label}</td><td class="n">${fmt(a.price)}</td></tr>`).join("");
  $("#out").innerHTML = `
    <div class="muted">${sel.label}</div>
    <div class="price">${fmt(sel.price)}</div>
    <div class="muted">Phiên bản mô hình: ${last.model_version} · ${UNIT_NOTE}</div>
    <div class="muted">Các mô hình dao động từ ${fmt(Math.min(...prices))} đến ${fmt(Math.max(...prices))}</div>
    <table><tr><th>Mô hình</th><th class="n">Giá dự đoán</th></tr>${rows}</table>`;
}

async function init() {
  const m = await (await fetch("/api/meta")).json();
  META = m.features; MODELS = m.models; current = m.default_model; UNIT = m.unit; UNIT_NOTE = m.unit_note; VERSION = m.model_version;
  META.forEach((f) => (KEY.includes(f.name) ? $("#main") : $("#more")).append(field(f)));
  if (!$("#main").children.length) META.slice(0, 6).forEach((f) => $("#main").append($("#f_" + f.name).parentElement));
  $("#moreBox").hidden = !$("#more").children.length;
  renderTabs();

  const mj = await (await fetch("/api/metrics")).json();
  const met = mj.models || [];
  if (met.length) {
    $("#metricsCard").hidden = false;
    $("#metricsTitle").textContent = `Độ chính xác mô hình (tập test, chia ${mj.split}, n_test=${mj.n_test})`;
    const best = Math.min(...met.map((r) => r.RMSE));
    $("#metrics").innerHTML = `<tr><th>Mô hình</th><th class="n">MAE</th><th class="n">RMSE</th><th class="n">R²</th></tr>` +
      met.map((r) => `<tr class="${r.RMSE === best ? "best" : ""}"><td>${r.label}</td>
        <td class="n">${Math.round(r.MAE)}</td><td class="n">${Math.round(r.RMSE)}</td><td class="n">${r.R2.toFixed(3)}</td></tr>`).join("");
  }
}

$("#fill").onclick = () => META.forEach((f) => {
  if (f.type === "number") $("#f_" + f.name).value = Math.round(f.median);
});

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  $("#err").textContent = ""; $("#go").disabled = true; $("#go").textContent = "Đang tính...";
  const values = {};
  META.forEach((f) => (values[f.name] = $("#f_" + f.name).value));
  try {
    const r = await fetch("/api/predict", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ values, model: current }) });
    const j = await r.json();
    if (!r.ok) throw new Error(Array.isArray(j.detail) ? j.detail.join("; ") : (j.detail || "Lỗi dự đoán"));
    last = j; renderResult();
  } catch (x) { $("#err").textContent = x.message; }
  $("#go").disabled = false; $("#go").textContent = "Dự đoán giá";
};

init().catch((x) => ($("#err").textContent = "Không tải được dữ liệu: " + x.message));
</script>
</body>
</html>
